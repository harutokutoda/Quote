<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Random Quote Generator</title>
<style>
  :root {
    --bg-1: #0f0c29;
    --bg-2: #302b63;
    --bg-3: #24243e;
    --accent: #7f5af0;
    --accent-2: #2cb67d;
    --text: #fffffe;
    --muted: #94a1b2;
    --card: rgba(255, 255, 255, 0.06);
    --border: rgba(255, 255, 255, 0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 1.5rem;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--text);
    background: linear-gradient(135deg, var(--bg-1), var(--bg-2), var(--bg-3));
    background-size: 300% 300%;
    animation: drift 18s ease infinite;
  }

  @keyframes drift {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }

  .card {
    width: min(680px, 100%);
    padding: 2.75rem 2.5rem 2rem;
    border-radius: 24px;
    background: var(--card);
    border: 1px solid var(--border);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: "";
    position: absolute;
    top: -60%;
    right: -30%;
    width: 380px;
    height: 380px;
    background: radial-gradient(circle, rgba(127, 90, 240, 0.35), transparent 70%);
    pointer-events: none;
  }

  .mark {
    font-size: 5rem;
    line-height: 0.6;
    color: var(--accent);
    opacity: 0.55;
    font-family: Georgia, serif;
    user-select: none;
  }

  .quote-box {
    min-height: 150px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    margin: 0.5rem 0 1.5rem;
  }

  .quote-text {
    font-size: clamp(1.2rem, 3.2vw, 1.6rem);
    line-height: 1.55;
    font-weight: 500;
    letter-spacing: 0.2px;
  }

  .quote-author {
    margin-top: 1.25rem;
    font-size: 1rem;
    color: var(--accent-2);
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .quote-author::before { content: "— "; opacity: 0.7; }

  .animate { animation: fadeUp 0.5s ease both; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .skeleton {
    height: 1.2em;
    border-radius: 8px;
    background: linear-gradient(90deg, rgba(255,255,255,.08) 25%, rgba(255,255,255,.18) 50%, rgba(255,255,255,.08) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.2s infinite;
    margin-bottom: 0.6rem;
  }
  @keyframes shimmer {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    align-items: center;
    border-top: 1px solid var(--border);
    padding-top: 1.5rem;
  }

  button, .icon-btn {
    font: inherit;
    cursor: pointer;
    border: none;
    border-radius: 12px;
    transition: transform 0.15s ease, opacity 0.2s ease, background 0.2s ease;
  }
  button:active:not(:disabled) { transform: scale(0.96); }
  button:disabled { cursor: not-allowed; }

  /* Visible focus ring for keyboard users */
  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  .btn-primary {
    position: relative;
    overflow: hidden;
    padding: 0.85rem 1.6rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, var(--accent), #5a3fd6);
    box-shadow: 0 8px 22px rgba(127, 90, 240, 0.35);
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    min-width: 172px;
    justify-content: center;
  }
  .btn-primary:hover:not(:disabled) { transform: translateY(-2px); }
  .btn-primary:disabled {
    filter: saturate(0.55) brightness(0.85);
    box-shadow: none;
  }

  .btn-primary .progress {
    position: absolute;
    left: 0;
    bottom: 0;
    height: 3px;
    width: 0%;
    background: rgba(255, 255, 255, 0.85);
    border-radius: 0 3px 3px 0;
    transition: width 0.2s linear;
  }

  .spacer { flex: 1 1 auto; }

  .icon-btn {
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 1.1rem;
  }
  .icon-btn:hover { background: rgba(255, 255, 255, 0.16); }

  .status {
    min-height: 1.25rem;
    margin-top: 1rem;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .status.error { color: #ff8f8f; }
  .status.success { color: var(--accent-2); }

  .spin { display: inline-block; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 480px) {
    .card { padding: 2rem 1.5rem 1.5rem; border-radius: 18px; }
    .mark { font-size: 3.5rem; }
    .btn-primary { min-width: 0; flex: 1 1 auto; }
  }
</style>
</head>
<body>

  <main class="card">
    <div class="mark" aria-hidden="true">&ldquo;</div>

    <div class="quote-box" id="quoteBox" aria-live="polite">
      <p class="quote-text" id="quoteText">Click “New Quote” to get inspired.</p>
      <p class="quote-author" id="quoteAuthor"></p>
    </div>

    <div class="actions">
      <button class="btn-primary" id="newQuoteBtn" type="button">
        <span id="btnIcon" aria-hidden="true">✨</span>
        <span id="btnLabel">New Quote</span>
        <span class="progress" id="btnProgress" aria-hidden="true"></span>
      </button>

      <span class="spacer"></span>

      <button class="icon-btn" id="copyBtn" type="button" title="Copy quote" aria-label="Copy quote">📋</button>
    </div>

    <p class="status" id="status" role="status" aria-live="polite"></p>
  </main>

<script>
(() => {
  "use strict";

  /* ------------------------------------------------------------------
     Multi-API chain — tries each in order until one returns a quote.
     All three are free and require no API key.
  ------------------------------------------------------------------ */
  const API_ENDPOINTS = [
    {
      name: "QuoteSlate",
      url: "https://quoteslate.vercel.app/api/quotes/random",
      parse: (data) => {
        const raw = Array.isArray(data) ? data[0] : (data.data ?? data);
        return {
          text:   raw.quote ?? raw.quoteText ?? raw.content ?? "",
          author: raw.author ?? raw.quoteAuthor ?? "Unknown",
          id:     raw.id ?? raw._id ?? null,
        };
      },
    },
    {
      name: "DummyJSON",
      url: "https://dummyjson.com/quotes/random",
      parse: (data) => ({
        text:   data.quote ?? "",
        author: data.author ?? "Unknown",
        id:     data.id ?? null,
      }),
    },
    {
      name: "Quotable",
      url: "https://api.quotable.io/random",
      parse: (data) => ({
        text:   data.content ?? "",
        author: data.author ?? "Unknown",
        id:     data._id ?? null,
      }),
    },
  ];

  const COOLDOWN_SECONDS = 4;
  const MAX_ATTEMPTS_PER_API = 3;

  const els = {
    box:      document.getElementById("quoteBox"),
    text:     document.getElementById("quoteText"),
    author:   document.getElementById("quoteAuthor"),
    btn:      document.getElementById("newQuoteBtn"),
    icon:     document.getElementById("btnIcon"),
    label:    document.getElementById("btnLabel"),
    progress: document.getElementById("btnProgress"),
    copy:     document.getElementById("copyBtn"),
    status:   document.getElementById("status"),
  };

  let current = { text: "", author: "" };
  let lastId = null;
  let isFetching = false;
  let cooldownTimer = null;
  let cooldownEnd = 0;

  const FALLBACKS = [
    { text: "You have power over your mind — not outside events. Realize this, and you will find strength.", author: "Marcus Aurelius" },
    { text: "It is not that we have a short time to live, but that we waste much of it.", author: "Seneca" },
    { text: "First say to yourself what you would be; and then do what you have to do.", author: "Epictetus" },
    { text: "The impediment to action advances action. What stands in the way becomes the way.", author: "Marcus Aurelius" },
    { text: "We are what we repeatedly do. Excellence, then, is not an act, but a habit.", author: "Will Durant" },
    { text: "The only true wisdom is in knowing you know nothing.", author: "Socrates" },
    { text: "He who has a why to live can bear almost any how.", author: "Friedrich Nietzsche" },
    { text: "The best way to predict the future is to invent it.", author: "Alan Kay" },
    { text: "Simplicity is the soul of efficiency.", author: "Austin Freeman" },
    { text: "Perfection is achieved, not when there is nothing more to add, but when there is nothing left to take away.", author: "Antoine de Saint-Exupéry" },
    { text: "Make it work, make it right, make it fast.", author: "Kent Beck" },
    { text: "Talk is cheap. Show me the code.", author: "Linus Torvalds" },
    { text: "The most dangerous phrase in the language is, 'We've always done it this way.'", author: "Grace Hopper" },
    { text: "Any fool can write code that a computer can understand. Good programmers write code that humans can understand.", author: "Martin Fowler" },
    { text: "The secret of getting ahead is getting started.", author: "Mark Twain" },
    { text: "Do not go where the path may lead, go instead where there is no path and leave a trail.", author: "Ralph Waldo Emerson" },
    { text: "It does not matter how slowly you go as long as you do not stop.", author: "Confucius" },
    { text: "The wound is the place where the Light enters you.", author: "Rumi" },
    { text: "Start where you are. Use what you have. Do what you can.", author: "Arthur Ashe" },
    { text: "Courage is not the absence of fear, but the triumph over it.", author: "Nelson Mandela" },
  ];

  /* ------------------------- UI helpers ----------------------------- */

  const setStatus = (msg, type = "") => {
    els.status.textContent = msg;
    els.status.className = "status" + (type ? " " + type : "");
  };

  const isCoolingDown = () => Date.now() < cooldownEnd;

  const setLoading = () => {
    els.btn.disabled = true;
    els.icon.textContent = "⏳";
    els.icon.className = "spin";
    els.label.textContent = "Loading…";
    els.progress.style.width = "0%";

    // Clear current so copying during load can't grab the previous quote
    current = { text: "", author: "" };

    els.box.classList.remove("animate");
    els.text.innerHTML =
      '<span class="skeleton" style="width:100%"></span>' +
      '<span class="skeleton" style="width:70%"></span>';
    els.author.textContent = "";
    setStatus("Fetching a fresh quote…");
  };

  const setReady = () => {
    els.btn.disabled = false;
    els.icon.textContent = "✨";
    els.icon.className = "";
    els.label.textContent = "New Quote";
    els.progress.style.width = "0%";
  };

  function startCooldown() {
    clearInterval(cooldownTimer);

    cooldownEnd = Date.now() + COOLDOWN_SECONDS * 1000;
    els.btn.disabled = true;
    els.icon.textContent = "⏳";
    els.icon.className = "";
    els.progress.style.width = "0%";

    const tick = () => {
      const msLeft = cooldownEnd - Date.now();

      if (msLeft <= 0) {
        clearInterval(cooldownTimer);
        cooldownTimer = null;
        cooldownEnd = 0;
        setReady();
        if (!els.status.classList.contains("error")) setStatus("");
        return;
      }

      const secsLeft = Math.ceil(msLeft / 1000);
      els.label.textContent = `Wait ${secsLeft}s`;

      const elapsed = COOLDOWN_SECONDS * 1000 - msLeft;
      els.progress.style.width =
        Math.min(100, (elapsed / (COOLDOWN_SECONDS * 1000)) * 100) + "%";
    };

    tick();
    cooldownTimer = setInterval(tick, 100);
  }

  const render = (quote) => {
    current = quote;
    els.text.textContent = quote.text;
    els.author.textContent = quote.author || "Unknown";

    els.box.classList.remove("animate");
    void els.box.offsetWidth;
    els.box.classList.add("animate");
  };

  /* ---------------------------- Fetching ---------------------------- */

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  async function tryApi(api) {
    for (let attempt = 0; attempt < MAX_ATTEMPTS_PER_API; attempt++) {
      try {
        const res = await fetch(api.url, { headers: { Accept: "application/json" } });
        if (!res.ok) throw new Error(`${api.name}: HTTP ${res.status}`);

        const data = await res.json();
        const quote = api.parse(data);

        if (!quote.text) throw new Error(`${api.name}: empty quote text`);

        if (quote.id === null || quote.id !== lastId) {
          return quote;
        }

        await sleep(120);
      } catch (err) {
        console.warn(`[${api.name}] attempt ${attempt + 1} failed:`, err.message);
        break;
      }
    }
    return null;
  }

  async function fetchQuote() {
    if (isFetching || isCoolingDown()) return;

    isFetching = true;
    setLoading();

    try {
      let quote = null;
      for (const api of API_ENDPOINTS) {
        quote = await tryApi(api);
        if (quote) break;
      }

      if (quote) {
        lastId = quote.id;
        render(quote);
        setStatus("Quote loaded ✓", "success");
      } else {
        const fb = FALLBACKS[Math.floor(Math.random() * FALLBACKS.length)];
        render(fb);
        setStatus("⚠ All APIs unreachable — showing a saved quote.", "error");
      }
    } catch (err) {
      console.error("Unexpected error:", err);
      const fb = FALLBACKS[Math.floor(Math.random() * FALLBACKS.length)];
      render(fb);
      setStatus("⚠ Unexpected error — showing a saved quote.", "error");
    } finally {
      isFetching = false;
      startCooldown();
    }
  }

  /* ---------------------------- Actions ----------------------------- */

  async function copyQuote() {
    if (!current.text) {
      setStatus("Nothing to copy yet — load a quote first.", "error");
      setTimeout(() => {
        if (!isCoolingDown() && !els.status.classList.contains("error")) setStatus("");
      }, 2000);
      return;
    }

    const payload = `"${current.text}" — ${current.author}`;

    try {
      await navigator.clipboard.writeText(payload);
      setStatus("Copied to clipboard ✓", "success");
    } catch {
      const ta = document.createElement("textarea");
      ta.value = payload;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      ta.remove();
      setStatus("Copied to clipboard ✓", "success");
    }

    setTimeout(() => {
      if (!isCoolingDown() && !els.status.classList.contains("error")) setStatus("");
    }, 2000);
  }

  /* ---------------------------- Wiring ------------------------------ */

  els.btn.addEventListener("click", fetchQuote);
  els.copy.addEventListener("click", copyQuote);

  /* Global shortcut: Space / Enter fires a new quote — but ONLY when the
     focus isn't already on an interactive element (button, link, input,
     textarea, select, or contenteditable). This keeps keyboard navigation
     working: focusing the Copy button and pressing Enter/Space copies the
     quote instead of being hijacked by this shortcut. */
  document.addEventListener("keydown", (e) => {
    if (e.code !== "Space" && e.key !== "Enter") return;

    const el = document.activeElement;
    if (!el) return;

    const tag = el.tagName;
    const isInteractive =
      tag === "BUTTON" ||
      tag === "A" ||
      tag === "INPUT" ||
      tag === "TEXTAREA" ||
      tag === "SELECT" ||
      el.isContentEditable;

    if (isInteractive) return;

    e.preventDefault();
    fetchQuote();
  });

  fetchQuote();
})();
</script>
</body>
</html>
