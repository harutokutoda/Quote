<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="A fast, accessible random quote generator." />
<title>Random Quote Generator</title>
<style>
  :root {
    --bg-1: #0f0c29;
    --bg-2: #302b63;
    --bg-3: #24243e;
    --accent: #7f5af0;
    --accent-2: #2cb67d;
    --text: #fffffe;
    --muted: #94a1b2;
    --card: rgba(255, 255, 255, 0.06);
    --border: rgba(255, 255, 255, 0.12);
    --error: #ff8f8f;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  [hidden] { display: none !important; }

  /* Visually hidden but available to assistive tech */
  .sr-only {
    position: absolute !important;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    clip-path: inset(50%);
    white-space: nowrap;
    border: 0;
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 1.5rem;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--text);
    background: linear-gradient(135deg, var(--bg-1), var(--bg-2), var(--bg-3));
    background-size: 300% 300%;
    animation: drift 18s ease infinite;
  }

  @keyframes drift {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }

  .card {
    width: min(680px, 100%);
    padding: 2.75rem 2.5rem 2rem;
    border-radius: 24px;
    background: var(--card);
    border: 1px solid var(--border);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: "";
    position: absolute;
    top: -60%;
    right: -30%;
    width: 380px;
    height: 380px;
    background: radial-gradient(circle, rgba(127, 90, 240, 0.35), transparent 70%);
    pointer-events: none;
  }

  .mark {
    font-size: 5rem;
    line-height: 0.6;
    color: var(--accent);
    opacity: 0.55;
    font-family: Georgia, serif;
    user-select: none;
  }

  .quote-box {
    min-height: 150px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    margin: 0.5rem 0 1.5rem;
  }

  #quoteWrap { transition: opacity 0.2s ease; }
  .quote-box.is-loading #quoteWrap { opacity: 0.4; }

  .quote-text {
    font-size: clamp(1.2rem, 3.2vw, 1.6rem);
    line-height: 1.55;
    font-weight: 500;
    letter-spacing: 0.2px;
  }

  .quote-author {
    margin-top: 1.25rem;
    font-size: 1rem;
    color: var(--accent-2);
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .quote-author::before { content: "— "; opacity: 0.7; }

  .animate { animation: fadeUp 0.5s ease both; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .skeleton {
    display: block;
    height: 1.2em;
    border-radius: 8px;
    background: linear-gradient(90deg, rgba(255,255,255,.08) 25%, rgba(255,255,255,.18) 50%, rgba(255,255,255,.08) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.2s infinite;
    margin-bottom: 0.6rem;
  }
  @keyframes shimmer {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    align-items: center;
    border-top: 1px solid var(--border);
    padding-top: 1.5rem;
  }

  button {
    font: inherit;
    cursor: pointer;
    border: none;
    border-radius: 12px;
    transition: transform 0.15s ease, opacity 0.2s ease, background 0.2s ease;
  }

  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  .btn-primary {
    position: relative;
    overflow: hidden;
    padding: 0.85rem 1.6rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, var(--accent), #5a3fd6);
    box-shadow: 0 8px 22px rgba(127, 90, 240, 0.35);
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    min-width: 172px;
    justify-content: center;
  }

  .btn-primary:hover:not([aria-disabled="true"]) { transform: translateY(-2px); }
  .btn-primary:active:not([aria-disabled="true"]) { transform: scale(0.96); }

  .btn-primary[aria-disabled="true"] {
    cursor: not-allowed;
    filter: saturate(0.55) brightness(0.85);
    box-shadow: none;
    transform: none;
  }

  .btn-primary .progress {
    position: absolute;
    left: 0;
    bottom: 0;
    height: 3px;
    width: 0%;
    background: rgba(255, 255, 255, 0.85);
    border-radius: 0 3px 3px 0;
    transition: width 0.2s linear;
  }

  .spacer { flex: 1 1 auto; }

  .icon-btn {
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 1.1rem;
  }
  .icon-btn:hover { background: rgba(255, 255, 255, 0.16); }

  .status {
    min-height: 1.25rem;
    margin-top: 1rem;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .status.error   { color: var(--error); }
  .status.success { color: var(--accent-2); }

  .spin { display: inline-block; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 480px) {
    .card { padding: 2rem 1.5rem 1.5rem; border-radius: 18px; }
    .mark { font-size: 3.5rem; }
    .btn-primary { min-width: 0; flex: 1 1 auto; }
  }

  /* Respect users who ask for less motion. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>
<body>

  <main class="card">
    <h1 class="sr-only">Random Quote Generator</h1>

    <div class="mark" aria-hidden="true">&ldquo;</div>

    <div class="quote-box" id="quoteBox" aria-live="polite" aria-atomic="true" aria-busy="false">
      <div id="skeleton" hidden aria-hidden="true">
        <span class="skeleton" style="width:100%"></span>
        <span class="skeleton" style="width:70%"></span>
      </div>

      <div id="quoteWrap">
        <p class="quote-text" id="quoteText">Click “New Quote” to get inspired.</p>
        <p class="quote-author" id="quoteAuthor"></p>
      </div>
    </div>

    <div class="actions">
      <button class="btn-primary" id="newQuoteBtn" type="button">
        <span id="btnIcon" aria-hidden="true">✨</span>
        <span id="btnLabel">New Quote</span>
        <span class="progress" id="btnProgress" aria-hidden="true"></span>
      </button>

      <span class="spacer"></span>

      <button class="icon-btn" id="copyBtn" type="button" title="Copy quote" aria-label="Copy quote">
        <span aria-hidden="true">📋</span>
      </button>
    </div>

    <p class="status" id="status" role="status" aria-live="polite"></p>
  </main>

<script>
(() => {
  "use strict";

  /* ------------------------------------------------------------------
     Multi-API chain — tried in order until one returns a usable quote.
     All are free and require no API key.

     parse() is defensive: unknown / malformed payloads return {} and are
     treated as a failure for that API rather than throwing.
  ------------------------------------------------------------------ */
  const API_ENDPOINTS = [
    {
      name: "QuoteSlate",
      url: "https://quoteslate.vercel.app/api/quotes/random",
      parse(data) {
        const raw = Array.isArray(data) ? data[0] : (data && data.data ? data.data : data);
        if (!raw || typeof raw !== "object") return {};
        return {
          text:   raw.quote ?? raw.quoteText ?? raw.content ?? "",
          author: raw.author ?? raw.quoteAuthor ?? "",
          id:     raw.id ?? raw._id ?? null,
        };
      },
    },
    {
      name: "DummyJSON",
      url: "https://dummyjson.com/quotes/random",
      parse(data) {
        if (!data || typeof data !== "object") return {};
        return {
          text:   data.quote ?? "",
          author: data.author ?? "",
          id:     data.id ?? null,
        };
      },
    },
    {
      name: "RealInspire",
      url: "https://api.realinspire.live/v1/quotes/random",
      parse(data) {
        const raw = Array.isArray(data) ? data[0] : data;
        if (!raw || typeof raw !== "object") return {};
        return {
          text:   raw.content ?? raw.quote ?? "",
          author: raw.author ?? "",
          id:     raw._id ?? raw.id ?? null,
        };
      },
    },
    {
      // Historically flaky — kept as a last-resort attempt only.
      name: "Quotable",
      url: "https://api.quotable.io/random",
      parse(data) {
        if (!data || typeof data !== "object") return {};
        return {
          text:   data.content ?? "",
          author: data.author ?? "",
          id:     data._id ?? null,
        };
      },
    },
  ];

  const COOLDOWN_SECONDS      = 4;    // after a successful load
  const FAILURE_COOLDOWN_SEC  = 2;    // after a fallback render
  const MAX_ATTEMPTS_PER_API  = 2;
  const REQUEST_TIMEOUT_MS    = 3500; // per individual HTTP request
  const RETRY_BASE_DELAY_MS   = 300;  // exponential backoff base
  const TOTAL_BUDGET_MS       = 9000; // wall-clock cap for the whole chain

  const els = {
    box:      document.getElementById("quoteBox"),
    wrap:     document.getElementById("quoteWrap"),
    skeleton: document.getElementById("skeleton"),
    text:     document.getElementById("quoteText"),
    author:   document.getElementById("quoteAuthor"),
    btn:      document.getElementById("newQuoteBtn"),
    icon:     document.getElementById("btnIcon"),
    label:    document.getElementById("btnLabel"),
    progress: document.getElementById("btnProgress"),
    copy:     document.getElementById("copyBtn"),
    status:   document.getElementById("status"),
  };

  let current      = { text: "", author: "" };
  let lastKey      = null;   // "<apiName>:<id>" — scoped so IDs can't collide
  let lastFallback = -1;
  let isFetching   = false;
  let cooldownTimer = null;
  let cooldownEnd   = 0;

  const FALLBACKS = [
    { text: "You have power over your mind — not outside events. Realize this, and you will find strength.", author: "Marcus Aurelius" },
    { text: "It is not that we have a short time to live, but that we waste much of it.", author: "Seneca" },
    { text: "First say to yourself what you would be; and then do what you have to do.", author: "Epictetus" },
    { text: "The impediment to action advances action. What stands in the way becomes the way.", author: "Marcus Aurelius" },
    { text: "We are what we repeatedly do. Excellence, then, is not an act, but a habit.", author: "Will Durant" },
    { text: "The only true wisdom is in knowing you know nothing.", author: "Socrates" },
    { text: "He who has a why to live can bear almost any how.", author: "Friedrich Nietzsche" },
    { text: "The best way to predict the future is to invent it.", author: "Alan Kay" },
    { text: "Simplicity is the soul of efficiency.", author: "Austin Freeman" },
    { text: "Perfection is achieved, not when there is nothing more to add, but when there is nothing left to take away.", author: "Antoine de Saint-Exupéry" },
    { text: "Make it work, make it right, make it fast.", author: "Kent Beck" },
    { text: "Talk is cheap. Show me the code.", author: "Linus Torvalds" },
    { text: "The most dangerous phrase in the language is, 'We've always done it this way.'", author: "Grace Hopper" },
    { text: "Any fool can write code that a computer can understand. Good programmers write code that humans can understand.", author: "Martin Fowler" },
    { text: "The secret of getting ahead is getting started.", author: "Mark Twain" },
    { text: "Do not go where the path may lead, go instead where there is no path and leave a trail.", author: "Ralph Waldo Emerson" },
    { text: "It does not matter how slowly you go as long as you do not stop.", author: "Confucius" },
    { text: "The wound is the place where the Light enters you.", author: "Rumi" },
    { text: "Start where you are. Use what you have. Do what you can.", author: "Arthur Ashe" },
    { text: "Courage is not the absence of fear, but the triumph over it.", author: "Nelson Mandela" },
  ];

  /* ------------------------- small utilities ------------------------ */

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  const pickFallback = () => {
    if (FALLBACKS.length === 1) return FALLBACKS[0];
    let i;
    do { i = Math.floor(Math.random() * FALLBACKS.length); }
    while (i === lastFallback);
    lastFallback = i;
    return FALLBACKS[i];
  };

  /* --------------------------- status line --------------------------
     A monotonically increasing token makes auto-clear safe: an older
     timer can never wipe a newer message.
  ------------------------------------------------------------------- */
  let statusToken = 0;

  function setStatus(msg, type = "", autoClearMs = 0) {
    const token = ++statusToken;
    els.status.textContent = msg;
    els.status.className = "status" + (type ? " " + type : "");
    if (autoClearMs > 0) {
      setTimeout(() => {
        if (token === statusToken) setStatus("");
      }, autoClearMs);
    }
  }

  /* ------------------------------ state ----------------------------- */

  const isCoolingDown = () => Date.now() < cooldownEnd;

  function resetProgress() {
    // Jump to 0 without animating backwards from 100%.
    els.progress.style.transition = "none";
    els.progress.style.width = "0%";
    void els.progress.offsetWidth;
    els.progress.style.transition = "";
  }

  function setLoading() {
    // NOTE: we deliberately do NOT use the `disabled` attribute. A disabled
    // element cannot hold focus, which would eject keyboard users mid-action.
    // `aria-disabled` conveys the same state while remaining focusable.
    els.btn.setAttribute("aria-disabled", "true");
    els.icon.textContent = "⏳";
    els.icon.classList.add("spin");
    els.label.textContent = "Loading…";
    resetProgress();
    els.box.setAttribute("aria-busy", "true");

    if (current.text) {
      // Keep the existing quote visible (dimmed) — avoids a jarring flash
      // and avoids emptying the live region.
      els.box.classList.add("is-loading");
    } else {
      els.skeleton.hidden = false;
      els.text.textContent = "";
      els.author.textContent = "";
    }

    setStatus("Fetching a fresh quote…");
  }

  function setReady() {
    els.btn.removeAttribute("aria-disabled");
    els.icon.textContent = "✨";
    els.icon.classList.remove("spin");
    els.label.textContent = "New Quote";
    resetProgress();
    els.box.removeAttribute("aria-busy");
    els.box.classList.remove("is-loading");
    els.skeleton.hidden = true;
  }

  function startCooldown(seconds) {
    clearInterval(cooldownTimer);
    cooldownTimer = null;

    if (!(seconds > 0)) {
      cooldownEnd = 0;
      setReady();
      return;
    }

    const total = seconds * 1000;
    cooldownEnd = Date.now() + total;

    els.btn.setAttribute("aria-disabled", "true");
    els.icon.textContent = "⏳";
    els.icon.classList.remove("spin");
    resetProgress();

    const tick = () => {
      const msLeft = cooldownEnd - Date.now();

      if (msLeft <= 0) {
        clearInterval(cooldownTimer);
        cooldownTimer = null;
        cooldownEnd = 0;
        setReady();
        // Intentionally do NOT clear the status line here — success/error
        // messages manage their own lifetimes via setStatus tokens.
        return;
      }

      els.label.textContent = `Wait ${Math.ceil(msLeft / 1000)}s`;
      els.progress.style.width =
        Math.min(100, ((total - msLeft) / total) * 100) + "%";
    };

    tick();
    cooldownTimer = setInterval(tick, 100);
  }

  function render(quote) {
    current = { text: quote.text, author: quote.author || "Unknown" };
    els.text.textContent = current.text;
    els.author.textContent = current.author;

    els.skeleton.hidden = true;
    els.box.classList.remove("is-loading");
    els.box.setAttribute("aria-busy", "false");

    els.box.classList.remove("animate");
    void els.box.offsetWidth;
    els.box.classList.add("animate");
  }

  /* ---------------------------- fetching ---------------------------- */

  async function fetchJson(url, timeoutMs) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeoutMs);
    try {
      const res = await fetch(url, {
        signal: ctrl.signal,
        headers: { Accept: "application/json" },
        cache: "no-store",
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return await res.json();
    } finally {
      clearTimeout(timer);
    }
  }

  /**
   * Try one API, up to MAX_ATTEMPTS_PER_API times, with exponential backoff.
   * Returns a normalized quote object or null. Never throws.
   */
  async function tryApi(api, deadline) {
    for (let attempt = 1; attempt <= MAX_ATTEMPTS_PER_API; attempt++) {
      const remaining = deadline - Date.now();
      if (remaining <= 250) return null;

      try {
        const data = await fetchJson(api.url, Math.min(REQUEST_TIMEOUT_MS, remaining));
        const parsed = api.parse(data);

        const text = String(parsed.text ?? "").trim();
        if (!text) throw new Error("empty quote text");

        const author = String(parsed.author ?? "").trim() || "Unknown";
        const key = parsed.id != null ? `${api.name}:${parsed.id}` : null;

        // Best-effort de-duplication: try once more for a different quote,
        // but accept a repeat rather than failing outright.
        if (key && key === lastKey && attempt < MAX_ATTEMPTS_PER_API) {
          await sleep(RETRY_BASE_DELAY_MS);
          continue;
        }

        return { text, author, key };
      } catch (err) {
        console.warn(
          `[${api.name}] attempt ${attempt}/${MAX_ATTEMPTS_PER_API} failed:`,
          err && err.message ? err.message : err
        );

        if (attempt === MAX_ATTEMPTS_PER_API) break;

        const backoff = RETRY_BASE_DELAY_MS * 2 ** (attempt - 1);
        if (Date.now() + backoff >= deadline) break;
        await sleep(backoff);
      }
    }
    return null;
  }

  async function fetchQuote() {
    if (isFetching || isCoolingDown()) return;

    isFetching = true;
    setLoading();

    const deadline = Date.now() + TOTAL_BUDGET_MS;
    let quote = null;

    try {
      for (const api of API_ENDPOINTS) {
        if (Date.now() >= deadline) break;
        quote = await tryApi(api, deadline);
        if (quote) break;
      }
    } catch (err) {
      // Defensive: tryApi shouldn't throw, but never leave the UI stuck.
      console.error("Unexpected error while fetching:", err);
      quote = null;
    }

    if (quote) {
      lastKey = quote.key;
      render(quote);
      setStatus("Quote loaded ✓", "success", 2500);
    } else {
      render(pickFallback());
      setStatus("⚠ All quote services unreachable — showing a saved quote.", "error");
    }

    isFetching = false;
    startCooldown(quote ? COOLDOWN_SECONDS : FAILURE_COOLDOWN_SEC);
  }

  /* ----------------------------- copying ---------------------------- */

  async function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch {
        /* fall through to legacy path */
      }
    }

    const prevFocus = document.activeElement;
    try {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.top = "0";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      const ok = document.execCommand("copy");
      ta.remove();
      return ok;
    } catch {
      return false;
    } finally {
      // The textarea stole focus; hand it back so keyboard users aren't
      // dropped onto <body>.
      if (prevFocus && typeof prevFocus.focus === "function") {
        prevFocus.focus();
      }
    }
  }

  async function copyQuote() {
    if (isFetching && !current.text) {
      setStatus("Still loading — one moment.", "", 2000);
      return;
    }
    if (!current.text) {
      setStatus("Nothing to copy yet — load a quote first.", "error", 2500);
      return;
    }

    const payload = `"${current.text}" — ${current.author}`;
    const ok = await copyText(payload);
    setStatus(
      ok ? "Copied to clipboard ✓" : "Couldn’t copy — please copy manually.",
      ok ? "success" : "error",
      ok ? 2000 : 3000
    );
  }

  /* ----------------------------- wiring ----------------------------- */

  els.btn.addEventListener("click", () => {
    // aria-disabled elements still fire click events, so guard manually.
    if (els.btn.getAttribute("aria-disabled") === "true") return;
    fetchQuote();
  });

  els.copy.addEventListener("click", copyQuote);

  /* Global shortcut: Space / Enter fires a new quote — but only when focus
     is NOT on an interactive element, and not while a modifier is held. */
  document.addEventListener("keydown", (e) => {
    if (e.repeat) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;

    const isSpace = e.code === "Space" || e.key === " ";
    const isEnter = e.key === "Enter";
    if (!isSpace && !isEnter) return;

    const el = document.activeElement;
    const tag = el ? el.tagName : "";
    const isInteractive =
      tag === "BUTTON" ||
      tag === "A" ||
      tag === "INPUT" ||
      tag === "TEXTAREA" ||
      tag === "SELECT" ||
      (el && el.isContentEditable);

    if (isInteractive) return;
    if (isFetching || isCoolingDown()) return;

    e.preventDefault();
    fetchQuote();
  });

  fetchQuote();
})();
</script>
</body>
</html>
